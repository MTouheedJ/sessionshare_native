version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sessionshare_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: sessionshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sessionshare_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: